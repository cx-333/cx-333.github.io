name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Match local npm version
        run: npm install --global npm@11.6.1
      - name: Install dependencies
        shell: bash
        run: |
          npm ci > /tmp/npm-ci.log 2>&1 || {
            cat /tmp/npm-ci.log
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 35 /tmp/npm-ci.log)
            exit 1
          }
          cat /tmp/npm-ci.log
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Publish static site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
